# Publishes a GitHub release when a version tag is pushed (git tag v0.2.0, then push the tag; GitHub Desktop: History,
# right-click the commit, Create Tag, then Push). The release carries <slug>.zip with a <slug>/ root folder and, when
# assets/mermaid/packs.json names this release, the 12 font packs windrose-livery-fonts-<script>.zip; GitHub publishes
# their sha256 digests, which Windrose Common checks before installing an update or a pack.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the zip (checks that the tag matches the plugin version)
        run: bash bin/build-zip.sh "$GITHUB_REF_NAME"

      # Font packs (Windrose Livery's fonts for other scripts). assets/mermaid/packs.json names the Livery release that
      # carries them ("version"). When it names this release, the fonts changed and the packs are built here: google/fonts
      # at the commit in bin/font-sources.json, cut with the pinned fontTools, and the summary must match the committed
      # packs.json. Otherwise nothing is built: the files the packs are made from must be the same as in that earlier
      # release (or the fonts changed and packs.json must name this release), and it must carry exactly the packs.
      - name: Which release carries the font packs
        id: packs
        run: |
          version=$(jq -r .version assets/mermaid/packs.json)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" = "$GITHUB_REF_NAME" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=false" >> "$GITHUB_OUTPUT"
          git fetch --quiet --no-tags --depth=1 origin "refs/tags/v$version:refs/tags/v$version"
          if ! git diff --quiet "v$version" HEAD -- bin/font-packs.py bin/font-packs-requirements.txt bin/font-sources.json assets/mermaid/scripts.json assets/mermaid/fonts.json assets/fonts assets/mermaid/packs.json; then
            echo "The font pack sources changed since v$version: run bin/font-packs.py build with this version in the plugin header, so packs.json names this release." >&2
            exit 1
          fi

      - if: steps.packs.outputs.build == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build the font packs
        if: steps.packs.outputs.build == 'true'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r bin/font-packs-requirements.txt
          cp assets/mermaid/packs.json "$RUNNER_TEMP/packs.json"
          python bin/font-packs.py build dist/packs
          python bin/font-packs.py same "$RUNNER_TEMP/packs.json"

      - name: The earlier release carries every pack
        if: steps.packs.outputs.build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.packs.outputs.tag }}
        run: |
          want=$(jq -r '.packs[].file' assets/mermaid/packs.json | sort)
          have=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q '.assets[] | select(.state == "uploaded" and .digest != null) | .name' | grep '^windrose-livery-fonts-' | sort || true)
          if [ "$want" != "$have" ]; then
            echo "Release $TAG does not carry exactly the font packs of assets/mermaid/packs.json." >&2
            exit 1
          fi
          echo "The font packs stay in $TAG."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ github.event.repository.name }}
        run: |
          shopt -s nullglob
          packs=( dist/packs/*.zip )
          gh release create "$GITHUB_REF_NAME" "dist/$SLUG.zip" "${packs[@]}" --title "$SLUG $GITHUB_REF_NAME" --generate-notes --verify-tag
